<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git 历史浏览器</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">Git <span>历史浏览器</span><span class="build-tag" id="buildTag" title="构建时间戳"></span></div>
    <div class="repo-input">
        <input id="repoPath" type="text" placeholder="/path/to/repo" spellcheck="false">
        <button id="btnOpen" class="primary">打开</button>
    </div>
    <div class="branch-box">
        <label for="branchSelect">分支</label>
        <select id="branchSelect"><option value="HEAD">HEAD</option></select>
    </div>
    <div class="repo-meta" id="repoMeta"></div>
</header>

<main class="layout">

    <!-- 左: 分支 -->
    <aside class="pane branches">
        <div class="pane-title">分支 <span class="count" id="branchCount">0</span></div>
        <ul id="branchList" class="list"></ul>
    </aside>

    <!-- 中: 提交图 -->
    <section class="pane history">
        <div class="pane-title">提交历史 <span class="count" id="historyCount">0</span></div>
        <ul id="historyList" class="list commit-list"></ul>
    </section>

    <!-- 右: 详情 + diff -->
    <section class="pane detail">
        <div class="pane-title">提交详情</div>
        <div id="commitDetail" class="commit-detail">
            <div class="empty">在左侧选一个提交查看改动</div>
        </div>
        <div id="diffPane" class="diff-pane hidden">
            <div class="file-tabs" id="fileTabs"></div>
            <div id="diffContent" class="diff-content"></div>
        </div>
    </section>

</main>

<!-- 底: 工作区 + 提交 -->
<footer class="workbar">
    <div class="work-left">
        <div class="pane-title inline">工作区 <span class="count" id="statusCount">0</span></div>
        <div id="statusList" class="status-list"></div>
    </div>
    <div class="work-right">
        <input id="commitMessage" type="text" placeholder="提交信息 (必填)" spellcheck="false">
        <label class="checkbox"><input type="checkbox" id="stageAll"> 暂存全部</label>
        <button id="btnCommit" class="primary">提交</button>
    </div>
</footer>

<div id="toast" class="toast hidden"></div>

<!-- app.js 用动态 URL 加载, 每次带唯一时间戳:
     彻底绕开浏览器缓存。之前"改了前端但用户还在跑旧版 js"就是这个坑 ——
     静态资源没带 Cache-Control 头时, 浏览器会启用启发式缓存 (按文件年龄的 10%
     当过期时间), 改了也不重新请求。服务端也加了 no-cache 头, 双保险。 -->
<script>
    window.__BUILD__ = 'r' + Date.now();
    (function () {
        var s = document.createElement('script');
        s.src = '/app.js?t=' + window.__BUILD__;
        s.async = false;
        document.body.appendChild(s);
    })();
</script>
</body>
</html>
